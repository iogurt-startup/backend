name: CI/CD IOUGURT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TEST_DB_USER: iougurt
  TEST_DB_PASSWORD: iougurt
  TEST_DB_NAME: iougurt_test
  TEST_JWT_SECRET: test-jwt-secret
  NODE_VERSION: '20'

jobs:
  lint-e-testes:
    name: Linter, Testes e Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iougurt
          POSTGRES_PASSWORD: iougurt
          POSTGRES_DB: iougurt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Verificar vulnerabilidades das dependências
        run: npm audit --audit-level=low

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Rodar Linter
        run: npm run lint

      - name: Rodar Typecheck
        run: npm run typecheck

      - name: Aplicar migrations no container Postgres
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
        run: npx prisma migrate deploy

      - name: Rodar Testes com Coverage
        env:
          DATABASE_URL: postgresql://iougurt:iougurt@localhost:5432/iougurt_test?schema=public
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
        run: npm run test:coverage

      - name: Upload do relatório de Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build-docker:
    name: Build da Imagem Docker
    needs: lint-e-testes
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/iougurt-api:latest', env.DOCKERHUB_USERNAME) || 'iougurt/iougurt-api:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
